<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TH67TECNHS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-TH67TECNHS');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive card collection loaded from an Excel workbook.">
    <title>Card Collection</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png">

    <link rel="stylesheet" href="styles.css">

    <!-- SheetJS reads card_details.xlsx directly in the browser. -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* Small additions only; the flip-card and dialog styling remains in styles(2).css. */
        .card-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-image-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: var(--navy-lighter);
            color: var(--muted);
            text-align: center;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .load-message {
            grid-column: 1 / -1;
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--navy-light);
            color: var(--muted);
        }

        .card-controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
            gap: 0.85rem;
            align-items: end;
            margin: 0 0 2rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--navy-light);
        }

        .filter-control {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .filter-control label {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .filter-control select,
        .clear-filters {
            width: 100%;
            min-height: 44px;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--navy);
            color: var(--text);
        }

        .filter-control select {
            cursor: pointer;
        }

        .clear-filters {
            width: auto;
            padding-inline: 1rem;
            color: var(--teal);
            cursor: pointer;
            white-space: nowrap;
        }

        .clear-filters:hover {
            background: var(--teal);
            color: var(--navy);
        }

        .results-count {
            margin: -1rem 0 1.25rem;
            color: var(--subtle);
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .card-controls {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .clear-filters {
                width: 100%;
            }
        }

        @media (max-width: 560px) {
            .card-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body id="top">
<nav class="navbar" aria-label="Portfolio navigation">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navbar-links">☰</button>
    <div class="navbar-links" id="navbar-links"></div>
</nav>

<main>
    <section class="section" id="featured-work">
        <div class="container">
            <p class="eyebrow">Featured work</p>
            <h2>Selected projects</h2>
            <p class="section-intro">
                Hover over a card to reveal its alternate image. Click any card to open more information.
            </p>

            <div class="card-controls" id="card-controls" hidden>
                <div class="filter-control">
                    <label for="sort-by">Sort by</label>
                    <select id="sort-by">
                        <option value="name-asc">Name A–Z</option>
                        <option value="name-desc">Name Z–A</option>
                        <option value="colour-asc">Colour A–Z</option>
                        <option value="colour-desc">Colour Z–A</option>
                        <option value="type-asc">Type A–Z</option>
                        <option value="type-desc">Type Z–A</option>
                        <option value="location-asc">Location A–Z</option>
                        <option value="location-desc">Location Z–A</option>
                    </select>
                </div>

                <div class="filter-control">
                    <label for="filter-colour">Colour</label>
                    <select id="filter-colour"><option value="">All colours</option></select>
                </div>

                <div class="filter-control">
                    <label for="filter-type">Type</label>
                    <select id="filter-type"><option value="">All types</option></select>
                </div>

                <div class="filter-control">
                    <label for="filter-location">Location</label>
                    <select id="filter-location"><option value="">All locations</option></select>
                </div>

                <button class="clear-filters" id="clear-filters" type="button">Clear filters</button>
            </div>

            <p class="results-count" id="results-count" aria-live="polite"></p>

            <div class="areas-grid capabilities-grid" id="cards-grid" aria-live="polite">
                <p class="load-message">Loading cards from card_details.xlsx…</p>
            </div>
        </div>
    </section>
</main>

<div id="dialogs-container"></div>

<a id="backToTop" href="#top" aria-label="Back to top">↑ Top</a>

<footer>
    <p>&copy; 2026 Andy Garnier. All rights reserved.</p>
</footer>

<script>
    const EXCEL_FILE = 'card_details.xlsx';
    const IMAGE_FOLDER = 'images';

    const cardsGrid = document.getElementById('cards-grid');
    const dialogsContainer = document.getElementById('dialogs-container');
    const cardControls = document.getElementById('card-controls');
    const sortBy = document.getElementById('sort-by');
    const filterColour = document.getElementById('filter-colour');
    const filterType = document.getElementById('filter-type');
    const filterLocation = document.getElementById('filter-location');
    const clearFilters = document.getElementById('clear-filters');
    const resultsCount = document.getElementById('results-count');

    let allRows = [];

    const menuToggle = document.getElementById('menu-toggle');
    const navbarLinks = document.getElementById('navbar-links');

    menuToggle.addEventListener('click', () => {
        const isOpen = navbarLinks.classList.toggle('active');
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        menuToggle.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
    });

    navbarLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            navbarLinks.classList.remove('active');
            menuToggle.setAttribute('aria-expanded', 'false');
            menuToggle.setAttribute('aria-label', 'Open navigation');
        });
    });

    function text(value) {
        return value == null ? '' : String(value).trim();
    }

    function slugify(value, fallback) {
        const slug = text(value)
            .toLowerCase()
            .replace(/[^a-z0-9_-]+/g, '_')
            .replace(/^_+|_+$/g, '');
        return slug || fallback;
    }

    function escapeHtml(value) {
        return text(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
        if (!value) return '';

        if (value instanceof Date && !Number.isNaN(value.getTime())) {
            return new Intl.DateTimeFormat('en-CA', {
                year: 'numeric',
                month: 'long'
            }).format(value);
        }

        if (typeof value === 'number') {
            const parsed = XLSX.SSF.parse_date_code(value);
            if (parsed) {
                const date = new Date(parsed.y, parsed.m - 1, parsed.d);
                return new Intl.DateTimeFormat('en-CA', {
                    year: 'numeric',
                    month: 'long'
                }).format(date);
            }
        }

        return text(value);
    }

    function imageMarkup(src, alt, placeholderText) {
        return `
            <img class="card-image" src="${escapeHtml(src)}" alt="${escapeHtml(alt)}"
                 onerror="this.hidden=true; this.nextElementSibling.hidden=false;">
            <span class="card-image-placeholder" hidden>${escapeHtml(placeholderText)}</span>
        `;
    }

    function createCard(row, index) {
        const fullName = text(row['Full name']) || `Card ${index + 1}`;
        const shortName = slugify(row['Short name'], `card_${index + 1}`);
        const dialogId = `dialog-${shortName}-${index + 1}`;

        // Image convention: images/<Short name>_front.png and images/<Short name>_back.png
        const frontImage = `${IMAGE_FOLDER}/${shortName}_front.png`;
        const backImage = `${IMAGE_FOLDER}/${shortName}_back.png`;

        const card = document.createElement('button');
        card.className = 'area-card fade-in';
        card.type = 'button';
        card.dataset.dialog = dialogId;
        card.setAttribute('aria-label', `Open information about ${fullName}`);

        card.innerHTML = `
            <div class="area-card-inner">
                <div class="area-card-front">
                    ${imageMarkup(frontImage, `${fullName} front image`, `${fullName}\nFront image`)}
                </div>
                <div class="area-card-back">
                    ${imageMarkup(backImage, `${fullName} alternate image`, `${fullName}\nBack image`)}
                </div>
            </div>
        `;

        return { card, dialogId, fullName };
    }

    function createDialog(row, dialogId, fullName) {
        const type = text(row['Type']);
        const fullLocation = text(row['Full location']);
        const shortLocation = text(row['Short location']);
        const date = formatDate(row['Date']);
        const notes = text(row['Notes']);
        const address = row["Full location"]?.trim() ?? "";
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
        const dialog = document.createElement('dialog');
        dialog.id = dialogId;
        dialog.setAttribute('aria-labelledby', `${dialogId}-title`);
        dialog.innerHTML = `
            <div class="dialog-content">
                <button class="dialog-close" type="button" aria-label="Close information">×</button>
                <p class="dialog-label">${escapeHtml([shortLocation, date, type].filter(Boolean).join(' · '))}</p>
                <h2 id="${dialogId}-title">${escapeHtml(fullName)}</h2>
                
                <h3>Notes</h3>
                <p>${escapeHtml(notes) || '—'}</p>

                <h3>Full location</h3>
                <p>
                    <a class="location-link"
                    href="${mapsUrl}"
                    target="_blank"
                    rel="noopener noreferrer">
                        ${address}
                    </a>
                </p>


            </div>
        `;
        return dialog;
    }

    function bindDialog(dialog) {
        const closeButton = dialog.querySelector('.dialog-close');
        closeButton.addEventListener('click', () => dialog.close());

        dialog.addEventListener('click', event => {
            const rect = dialog.getBoundingClientRect();
            const clickedOutside =
                event.clientX < rect.left ||
                event.clientX > rect.right ||
                event.clientY < rect.top ||
                event.clientY > rect.bottom;

            if (clickedOutside) dialog.close();
        });

        dialog.addEventListener('close', () => {
            document.body.classList.remove('modal-open');
        });
    }

    function uniqueValues(rows, key) {
        return [...new Set(rows.map(row => text(row[key])).filter(Boolean))]
            .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function populateSelect(select, values, allLabel) {
        select.innerHTML = `<option value="">${allLabel}</option>`;
        values.forEach(value => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        });
    }

    function setupControls(rows) {
        populateSelect(filterColour, uniqueValues(rows, 'Colour'), 'All colours');
        populateSelect(filterType, uniqueValues(rows, 'Type'), 'All types');
        populateSelect(filterLocation, uniqueValues(rows, 'Short location'), 'All locations');
        cardControls.hidden = false;
    }

    function getFilteredAndSortedRows() {
        const colour = filterColour.value;
        const type = filterType.value;
        const location = filterLocation.value;

        const filtered = allRows.filter(row => {
            return (!colour || text(row['Colour']) === colour) &&
                   (!type || text(row['Type']) === type) &&
                   (!location || text(row['Short location']) === location);
        });

        const [field, direction] = sortBy.value.split('-');
        const keyMap = {
            name: 'Full name',
            colour: 'Colour',
            type: 'Type',
            location: 'Short location'
        };
        const key = keyMap[field] || 'Full name';
        const multiplier = direction === 'desc' ? -1 : 1;

        return filtered.sort((a, b) =>
            text(a[key]).localeCompare(text(b[key]), undefined, {
                sensitivity: 'base',
                numeric: true
            }) * multiplier
        );
    }

    function renderRows(rows) {
        cardsGrid.innerHTML = '';
        dialogsContainer.innerHTML = '';

        if (!rows.length) {
            cardsGrid.innerHTML = '<p class="load-message">No cards match the current filters.</p>';
            resultsCount.textContent = `Showing 0 of ${allRows.length} cards`;
            return;
        }

        resultsCount.textContent = `Showing ${rows.length} of ${allRows.length} card${allRows.length === 1 ? '' : 's'}`;

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('in-view');
            });
        }, { threshold: 0.08 });

        rows.forEach((row, index) => {
            const { card, dialogId, fullName } = createCard(row, index);
            const dialog = createDialog(row, dialogId, fullName);

            card.addEventListener('click', () => {
                dialog.showModal();
                document.body.classList.add('modal-open');
            });

            bindDialog(dialog);
            cardsGrid.appendChild(card);
            dialogsContainer.appendChild(dialog);
            observer.observe(card);
        });
    }

    function applyControls() {
        renderRows(getFilteredAndSortedRows());
    }

    [sortBy, filterColour, filterType, filterLocation].forEach(control => {
        control.addEventListener('change', applyControls);
    });

    clearFilters.addEventListener('click', () => {
        sortBy.value = 'name-asc';
        filterColour.value = '';
        filterType.value = '';
        filterLocation.value = '';
        applyControls();
    });

    async function loadCardsFromExcel() {
        try {
            const response = await fetch(EXCEL_FILE, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Could not load ${EXCEL_FILE} (${response.status})`);
            }

            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, {
                type: 'array',
                cellDates: true
            });

            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet, {
                defval: '',
                raw: true
            });

            allRows = rows.filter(row => text(row['Full name']));

            if (!allRows.length) {
                cardsGrid.innerHTML = '<p class="load-message">No rows with a “Full name” value were found in the spreadsheet.</p>';
                return;
            }

            setupControls(allRows);
            applyControls();
        } catch (error) {
            console.error(error);
            cardsGrid.innerHTML = `
                <div class="load-message">
                    <strong>Could not load ${escapeHtml(EXCEL_FILE)}.</strong><br>
                    Make sure the Excel file is in the same folder as this HTML file and view the site through a web server. Browsers usually block automatic Excel loading when an HTML file is opened directly with a <code>file://</code> address.
                </div>
            `;
        }
    }

    const backToTopButton = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
        backToTopButton.classList.toggle('visible', window.scrollY > 450);
    });

    loadCardsFromExcel();
</script>
</body>
</html>
